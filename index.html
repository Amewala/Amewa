<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transcriptor de Voz</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #1a1d24;
    --accent: #5b8cff;
    --accent-hover: #7ba0ff;
    --text: #e8eaf0;
    --muted: #8b90a0;
    --danger: #ff5b5b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    padding: 20px;
  }
  .card {
    width: 100%;
    max-width: 640px;
    background: var(--panel);
    border-radius: 16px;
    padding: 32px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 4px;
  }
  p.subtitle {
    color: var(--muted);
    margin: 0 0 24px;
    font-size: 0.9rem;
  }
  .controls {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  button {
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  button:active { transform: scale(0.97); }
  #startBtn {
    background: var(--accent);
    color: white;
  }
  #startBtn:hover { background: var(--accent-hover); }
  #startBtn.recording {
    background: var(--danger);
  }
  #clearBtn {
    background: #2a2e38;
    color: var(--text);
  }
  #clearBtn:hover { background: #343945; }
  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 16px;
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--muted);
  }
  .dot.live {
    background: var(--danger);
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(255,91,91,0.5); }
    70% { box-shadow: 0 0 0 8px rgba(255,91,91,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,91,91,0); }
  }
  #transcript {
    min-height: 200px;
    max-height: 400px;
    overflow-y: auto;
    background: #0f1115;
    border: 1px solid #2a2e38;
    border-radius: 12px;
    padding: 16px;
    line-height: 1.6;
    font-size: 1rem;
    white-space: pre-wrap;
  }
  .interim {
    color: var(--muted);
    font-style: italic;
  }
  .error {
    color: var(--danger);
    font-size: 0.85rem;
    margin-top: 12px;
    display: none;
  }
  select {
    background: #2a2e38;
    color: var(--text);
    border: none;
    border-radius: 10px;
    padding: 12px;
    font-size: 0.9rem;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>🎙️ Transcriptor de Voz</h1>
    <p class="subtitle">Habla y verás la transcripción en tiempo real</p>

    <div class="controls">
      <button id="startBtn">▶️ Iniciar</button>
      <button id="clearBtn">🗑️ Limpiar</button>
      <select id="langSelect">
        <option value="es-CL">Español (Chile)</option>
        <option value="es-ES">Español (España)</option>
        <option value="en-US">English (US)</option>
        <option value="pt-BR">Português (Brasil)</option>
      </select>
    </div>

    <div class="status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Detenido</span>
    </div>

    <div id="transcript"></div>
    <div class="error" id="errorMsg"></div>
  </div>

<script>
  const startBtn = document.getElementById('startBtn');
  const clearBtn = document.getElementById('clearBtn');
  const transcriptDiv = document.getElementById('transcript');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const errorMsg = document.getElementById('errorMsg');
  const langSelect = document.getElementById('langSelect');

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    errorMsg.style.display = 'block';
    errorMsg.textContent = 'Tu navegador no soporta reconocimiento de voz. Prueba con Google Chrome.';
    startBtn.disabled = true;
  }

  let recognition = null;
  let listening = false;
  let finalText = '';

  function createRecognition() {
    const r = new SpeechRecognition();
    r.continuous = true;
    r.interimResults = true;
    r.lang = langSelect.value;

    r.onresult = (event) => {
      let interim = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const transcriptPiece = event.results[i][0].transcript;
        if (event.results[i].isFinal) {
          finalText += transcriptPiece + ' ';
        } else {
          interim += transcriptPiece;
        }
      }
      render(interim);
    };

    r.onerror = (event) => {
      errorMsg.style.display = 'block';
      if (event.error === 'not-allowed') {
        errorMsg.textContent = 'Permiso de micrófono denegado. Habilítalo en la configuración del navegador.';
      } else if (event.error === 'no-speech') {
        errorMsg.textContent = 'No se detectó voz. Sigue intentando.';
      } else {
        errorMsg.textContent = 'Error: ' + event.error;
      }
    };

    r.onend = () => {
      if (listening) {
        // Reinicia automáticamente si se corta (comportamiento típico del navegador)
        r.start();
      }
    };

    return r;
  }

  function render(interim) {
    transcriptDiv.innerHTML = escapeHtml(finalText) +
      (interim ? '<span class="interim">' + escapeHtml(interim) + '</span>' : '');
    transcriptDiv.scrollTop = transcriptDiv.scrollHeight;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  startBtn.addEventListener('click', () => {
    if (!listening) {
      errorMsg.style.display = 'none';
      recognition = createRecognition();
      recognition.start();
      listening = true;
      startBtn.textContent = '⏹️ Detener';
      startBtn.classList.add('recording');
      statusDot.classList.add('live');
      statusText.textContent = 'Escuchando…';
      langSelect.disabled = true;
    } else {
      listening = false;
      recognition.onend = null;
      recognition.stop();
      startBtn.textContent = '▶️ Iniciar';
      startBtn.classList.remove('recording');
      statusDot.classList.remove('live');
      statusText.textContent = 'Detenido';
      langSelect.disabled = false;
    }
  });

  clearBtn.addEventListener('click', () => {
    finalText = '';
    render('');
  });
</script>
</body>
</html>
